# ansible.cfg - 2단계 Ansible 설정 파일
# 이 폴더(stage2)에서 ansible 명령을 실행하면 자동으로 읽힙니다. (Makefile이 cd stage2 한 뒤 실행하는 이유)
[defaults]
# inventory : 사용할 노드 목록 파일. 1단계가 자동으로 만들어 줍니다. (common/generate-inventory.py)
inventory = inventory.ini
# remote_user : 노드에 SSH로 접속할 계정. cloud-init이 만든 kit 계정입니다.
remote_user = kit
# private_key_file : 접속에 쓸 SSH 개인 키 (1단계 stage1/prepare.sh 가 만든 키)
private_key_file = ~/.ssh/id_vm_ed25519
# host_key_checking = False : 처음 접속하는 서버의 지문 확인 질문을 건너뜁니다.
# (VM을 지우고 다시 만들 때마다 지문이 바뀌는 실습 환경이라 이렇게 두었습니다. 실제 운영 환경에서는 켜 두는 것이 안전합니다)
host_key_checking = False
# interpreter_python = auto_silent : 노드의 파이썬 위치를 자동으로 찾고, 경고 메시지는 출력하지 않습니다.
interpreter_python = auto_silent

# 관리자 권한 설정: 작업을 sudo로 root 권한으로 실행합니다.
[privilege_escalation]
become = True
become_method = sudo
become_user = root
