---
# ==============================================================
# prepare-nodes.yml - [2단계] Ansible 플레이북: 4대 노드를 Kubernetes 설치 전 상태로 맞추기
# ==============================================================
# 플레이북(playbook) = "어떤 서버에서 어떤 작업을 어떤 순서로 할지" 적은 YAML 파일입니다.
# 실행: make stage-2 (내부적으로 ansible-playbook prepare-nodes.yml)
#
# 용어
#   hosts: all      : 인벤토리의 모든 노드(4대)에 적용
#   become: true    : 각 작업을 관리자(root) 권한(sudo)으로 실행
#   tasks           : 위에서 아래로 차례대로 실행하는 작업 목록. 각 작업은 "모듈"(ansible.builtin.xxx)을 사용
#   changed_when: false : command 모듈은 항상 "변경됨"으로 표시되므로, 변경으로 세지 않도록 지정
#   handlers        : 어떤 작업이 "실제로 변경"을 일으켰을 때만 실행되는 후속 작업 (notify 로 호출)
# 이 파일은 여러 번 실행해도 같은 결과가 나오게(재실행 안전) 작성되어 있습니다.
# 결과는 stage2/postcheck.sh 가 확인합니다.
- name: Kubernetes 노드 사전 설정
  hosts: all
  become: true
  tasks:
    # [1] swap 끄기
    # swap = 메모리가 부족할 때 디스크를 메모리처럼 쓰는 기능. Kubernetes(kubelet)는 기본적으로 swap이 켜져 있으면 시작을 거부합니다.
    # swapoff -a : 지금 켜져 있는 swap을 모두 즉시 끕니다.
    - name: swap 즉시 끄기
      ansible.builtin.command: swapoff -a
      changed_when: false

    # [2] /etc/fstab 의 swap 줄을 주석 처리
    # /etc/fstab 은 부팅 때 자동으로 연결할 디스크 목록입니다. 거기에 swap이 남아 있으면 재부팅 후 swap이 다시 켜지므로 앞에 # 를 붙여 비활성화합니다.
    # regexp : 주석이 아니면서 " swap " 이 들어간 줄을 찾는 정규식. replace: '# \1' 은 찾은 줄 앞에 "# "를 붙여 다시 씁니다.
    - name: fstab의 swap 항목 주석 처리 (재부팅 후에도 꺼진 상태 유지)
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#\n].*\sswap\s.*)$'
        replace: '# \1'

    # [3] 부팅할 때 자동으로 올릴 커널 모듈 목록 파일 만들기 (/etc/modules-load.d/k8s.conf)
    #   overlay       : 컨테이너 이미지 파일시스템에 쓰이는 모듈
    #   br_netfilter  : 브리지 네트워크 트래픽이 방화벽(iptables) 규칙을 거치게 하는 모듈
    - name: 부팅 시 올릴 커널 모듈 목록
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter
        mode: "0644"

    # [4] 위 두 모듈을 지금 즉시 로드합니다. (재부팅하지 않아도 바로 적용) loop 는 목록의 항목마다 한 번씩 실행한다는 뜻입니다.
    - name: 커널 모듈 즉시 로드
      ansible.builtin.command: "modprobe {{ item }}"
      loop: [overlay, br_netfilter]
      changed_when: false

    # [5] 네트워크 관련 커널 설정 파일 만들기 (/etc/sysctl.d/99-k8s.conf)
    #   ip_forward = 1                       : 패킷을 다른 곳으로 전달 허용 (Pod/노드 간 통신에 필요)
    #   bridge-nf-call-iptables / ip6tables  : 브리지를 지나는 IPv4/IPv6 트래픽에도 iptables 규칙 적용
    - name: 네트워크 커널 설정
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-k8s.conf
        content: |
          net.ipv4.ip_forward = 1
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
        mode: "0644"

    # [6] 위 설정 파일을 지금 즉시 적용합니다. (sysctl --system : 설정 파일을 모두 다시 읽음)
    - name: 커널 설정 즉시 적용
      ansible.builtin.command: sysctl --system
      changed_when: false

    # [7] 노드 이름을 /etc/hosts 에 등록 (노드끼리 IP 대신 이름으로 서로 찾을 수 있게)
    # blockinfile : 표식(marker) 사이의 블록만 관리하므로 여러 번 실행해도 같은 블록이 중복되지 않습니다.
    # {{ hostvars['cp']['ansible_host'] }} 는 인벤토리에 적힌 cp 노드의 IP로 바뀝니다.
    # /etc/hosts 외에 cloud-init의 hosts 템플릿(/etc/cloud/templates/hosts.debian.tmpl)에도 같은 내용을 넣습니다.
    # (cloud-init이 부팅 때마다 /etc/hosts 를 이 템플릿으로 다시 만들기 때문입니다)
    - name: 노드 이름을 /etc/hosts와 cloud-init 템플릿에 등록
      ansible.builtin.blockinfile:
        path: "{{ item }}"
        marker: "# {mark} OPENINFRA NODES"
        block: |
          {{ hostvars['cp']['ansible_host'] }} cp
          {{ hostvars['ctrl-worker']['ansible_host'] }} ctrl-worker
          {{ hostvars['compute-1']['ansible_host'] }} compute-1
          {{ hostvars['compute-2']['ansible_host'] }} compute-2
      loop:
        - /etc/hosts
        - /etc/cloud/templates/hosts.debian.tmpl

    # [8] DHCP가 알려 주는 "검색 도메인"(search domain)을 사용하지 않도록 설정
    # 시스템 네트워크 서비스(systemd-networkd) 설정 파일을 만들어 enp1s0 인터페이스에서 UseDomains=false 로 둡니다.
    # (DNS 이름 해석이 불필요한 도메인 때문에 꼬이는 것을 막으려는 설정입니다)
    # notify : 이 작업이 파일을 실제로 바꿨을 때만 아래 handlers 의 "Restart systemd-networkd" 를 실행합니다.
    - name: DHCP search domain 비활성화
      ansible.builtin.copy:
        dest: /etc/systemd/network/99-openinfra-no-dhcp-domains.network
        content: |
          [Match]
          Name=enp1s0

          [DHCPv4]
          UseDomains=false
        mode: "0644"
      notify: Restart systemd-networkd

    # [9] Kubernetes 설치에 필요한 기본 패키지 설치
    #   curl, ca-certificates, gnupg : 파일 다운로드와 보안 연결(인증서)용
    #   conntrack, socat, ipset, ebtables, ethtool : Kubernetes 네트워킹 구성요소가 사용하는 도구
    # state: present : 없으면 설치, 있으면 그대로 둠 / cache_valid_time: 3600 : 1시간 안에 목록을 갱신했으면 apt update 생략
    - name: 기본 패키지 설치
      ansible.builtin.apt:
        name: [curl, ca-certificates, gnupg, conntrack, socat, ipset, ebtables, ethtool]
        state: present
        update_cache: true
        cache_valid_time: 3600

  # 핸들러: 위 [8] 작업이 파일을 바꿨을 때만 실행되어 네트워크 서비스를 재시작합니다. (바뀐 설정을 적용)
  handlers:
    - name: Restart systemd-networkd
      ansible.builtin.systemd:
        name: systemd-networkd
        state: restarted
